    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status');
    const predictionText = document.getElementById('prediction');

    let classifier;
    let currentLandmarks = null;

   async function setupApp() {
      classifier = knnClassifier.create();
      
      // AUTO-LOAD PRETRAINED DATA
      if (typeof PRETRAINED_DATA !== 'undefined' && Object.keys(PRETRAINED_DATA).length > 0) {
        let tensorDataset = {};
        Object.keys(PRETRAINED_DATA).forEach((key) => {
          tensorDataset[key] = tf.tensor(PRETRAINED_DATA[key], [PRETRAINED_DATA[key].length / 63, 63]);
        });
        classifier.setClassifierDataset(tensorDataset);
        statusText.innerText = "Pre-trained gesture model auto-loaded!";
        statusText.className = "mt-4 text-sm text-teal-400";
      }

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults(onResults);

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });

      await camera.start();
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        currentLandmarks = landmarks.flatMap(pt => [pt.x, pt.y, pt.z]);

        // Draw skeleton keypoints on video overlay
        for (const pt of landmarks) {
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 4, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#818cf8';
          canvasCtx.fill();
        }

        // Run prediction if model contains trained data
        if (classifier.getNumClasses() > 0) {
          predict();
        }
      } else {
        currentLandmarks = null;
      }
      canvasCtx.restore();
    }

    function trainSign(label) {
      if (!currentLandmarks) {
        alert("Please show your hand to the camera before recording!");
        return;
      }
      const tensor = tf.tensor1d(currentLandmarks);
      classifier.addExample(tensor, label);
      statusText.innerText = `Recorded sample for: "${label}"`;
      statusText.className = "mt-4 text-sm text-emerald-400";
    }

    async function predict() {
      if (!currentLandmarks) return;
      const tensor = tf.tensor1d(currentLandmarks);
      const result = await classifier.predictClass(tensor);
      
      if (result.label) {
        predictionText.innerText = result.label;
      }
    }

    function speakCurrent() {
      const word = predictionText.innerText;
      if (word && word !== "Waiting for signs...") {
        const utterance = new SpeechSynthesisUtterance(word);
        window.speechSynthesis.speak(utterance);
      }
    }

    function saveModel() {
      if (classifier.getNumClasses() === 0) {
        alert("Please record at least one gesture before saving!");
        return;
      }
      const dataset = classifier.getClassifierDataset();
      let datasetObj = {};
      Object.keys(dataset).forEach((key) => {
        let data = dataset[key].dataSync();
        datasetObj[key] = Array.from(data);
      });
      const jsonStr = JSON.stringify(datasetObj);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "signspeak_model.json";
      a.click();
      statusText.innerText = "Model saved to downloads!";
    }

    function loadModel() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json";
      input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
          const datasetObj = JSON.parse(event.target.result);
          let tensorDataset = {};
          Object.keys(datasetObj).forEach((key) => {
            tensorDataset[key] = tf.tensor(datasetObj[key], [datasetObj[key].length / 63, 63]);
          });
          classifier.setClassifierDataset(tensorDataset);
          statusText.innerText = "Loaded saved gesture dataset!";
          statusText.className = "mt-4 text-sm text-teal-400";
        };
        reader.readAsText(file);
      };
      input.click();
    }

    setupApp();
  </script>
